name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  validate:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - run: npm ci
      - run: npm install --global opencode-ai@1.18.21
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:plugin
      - run: npm run test:integration
      - run: npm run test:opencode
      - run: npm run test:package

  platform-smoke:
    name: OpenCode smoke (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - run: npm ci
      - run: npm install --global opencode-ai@1.18.21
      - run: npm run test:opencode

  publish:
    name: Publish npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, platform-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify tag matches package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: test "${TAG_VERSION#v}" = "$(node -p "require('./package.json').version")"
      - run: npm publish
