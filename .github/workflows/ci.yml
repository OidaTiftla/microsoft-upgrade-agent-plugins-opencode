name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: npm ci
      - run: npm install --global opencode-ai@1.18.21
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:plugin
      - run: npm run test:integration
      - run: npm run test:opencode
      - run: npm run test:package

  platform-smoke:
    name: OpenCode smoke (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: npm ci
      - run: npm install --global opencode-ai@1.18.21
      - run: npm run test:opencode
